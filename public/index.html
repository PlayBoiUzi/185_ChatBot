<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <h1>Chatbot AI</h1>
      <p>NVIDIA Nemotron 3.5 Lightning</p>
    </header>

    <section id="messages" class="chat__messages" aria-live="polite">
      <div class="msg msg--bot">Halo! Ada yang bisa saya bantu?</div>
    </section>

    <div class="chat__input">
      <input id="input" type="text" placeholder="Ketik pesan..." autocomplete="off" aria-label="Pesan" />
      <button id="send" type="button">Kirim</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
